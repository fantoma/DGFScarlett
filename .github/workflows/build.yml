# Prova DGFScarlett e costruisce l'AppImage per Linux. Designed by Diego Fantoma.
#
#  push sul ramo main / pull request  → test (Python 3.10 e 3.12), pochi minuti
#  tag «v1.2.3»                       → test + AppImage allegata alla Release «v1.2.3»
#  Actions › Build › Run workflow     → test + AppImage scaricabile da «Artifacts» per 3 giorni
#
# DGFScarlett usa ALSA: esiste solo per Linux, quindi niente Windows/macOS (e pochi minuti consumati).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # ------------------------------------------------------------------ test dai sorgenti
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]       # 3.10 = Ubuntu 22.04: controlla anche la protezione dal difetto di PySide6 6.12
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dipendenze di sistema
        run: sudo apt-get update && sudo apt-get install -y alsa-utils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Librerie Python
        run: python -m pip install PySide6-Essentials pyflakes
      - name: Controllo statico
        run: python -m pyflakes dgfscarlett.py tests packaging/prune_qt.py
      - name: Script di shell
        run: bash -n install.sh run.sh release.sh crea_repo_github.sh packaging/build_appimage.sh packaging/AppRun
      - name: Test (scheda simulata)
        run: python -m unittest discover -s tests -v
      - name: Self-test
        run: python dgfscarlett.py --self-test

  # ------------------------------------------------------------------ Release (solo sui tag v*)
  release:
    name: Prepara la Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Il tag corrisponde alla versione?
        run: |
          V=$(sed -n 's/^VERSION *= *"\(.*\)"/\1/p' dgfscarlett.py)
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Il tag è ${GITHUB_REF_NAME} ma dgfscarlett.py dice $V: allineali"; exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: DGFScarlett ${{ github.ref_name }}
          generate_release_notes: true

  # ------------------------------------------------------------------ Linux: AppImage
  linux:
    name: Linux AppImage
    needs: [test, release]
    if: ${{ !failure() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: build/cache
          key: appimage-cache-${{ hashFiles('packaging/build_appimage.sh') }}
      - name: Librerie per la prova di avvio
        run: sudo apt-get update && sudo apt-get install -y alsa-utils libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libx11-6 libxext6 libxrandr2
      - name: Costruisci
        run: packaging/build_appimage.sh
      - name: Allega alla Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
      - name: Artifact (esecuzione manuale)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: DGFScarlett-linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          retention-days: 3
